upstream s10 {
    server 192.168.202.10:80;
}

server {
    # The router maps public 8000 to this TLS listener on port 80.
    listen 0.0.0.0:80 ssl;
    listen 0.0.0.0:8080 ssl;
    server_name drawing.wujialei.com;
    http2 on;

    ssl_certificate /etc/nginx/ssl/wildcard.wujialei.com/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard.wujialei.com/current/privkey.pem;

    error_page 497 =308 https://$http_host$request_uri;

    location / {
        proxy_pass http://s10;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
